# DigitalOcean App Platform spec — one app, two components.
# Create with: doctl apps create --spec .do/app.yaml
# Then set MODEL_ACCESS_KEY in the control panel (backend → Settings → Environment Variables, Encrypt).
name: recap-buddy
region: blr

services:
  - name: backend
    github:
      repo: Tejas-Santosh-Nalawade/Hacktoberfest-Hack-Day-ACES
      branch: main
      deploy_on_push: true
    source_dir: backend
    environment_slug: python
    run_command: uvicorn main:app --host 0.0.0.0 --port 8080
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    health_check:
      http_path: /api/health
    envs:
      - key: MODEL_ACCESS_KEY
        scope: RUN_TIME
        type: SECRET
      - key: MODEL_ID
        scope: RUN_TIME
        value: gemma-4-31B-it
      - key: FALLBACK_MODEL_ID
        scope: RUN_TIME
        value: openai-gpt-oss-120b

static_sites:
  - name: frontend
    github:
      repo: Tejas-Santosh-Nalawade/Hacktoberfest-Hack-Day-ACES
      branch: main
      deploy_on_push: true
    source_dir: frontend
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    catchall_document: index.html

ingress:
  rules:
    - component:
        name: backend
        preserve_path_prefix: true
      match:
        path:
          prefix: /api
    - component:
        name: frontend
      match:
        path:
          prefix: /
